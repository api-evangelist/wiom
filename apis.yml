aid: wiom
name: Wiom
description: 'Wiom is an Indian consumer internet company offering recharge-based home
  broadband: shared WiFi delivered over a community mesh network so households can pay only
  for the internet they actually use, without a mobile-data plan or a traditional fixed-line
  broadband contract. It was surfaced into the API Evangelist network as a portfolio lead of
  Accel. As of this enrichment pass Wiom operates a consumer marketing website (a React
  single-page application) but publishes no public developer portal, API documentation, or
  machine-readable API surface, so this profile carries verified identity and a live
  domain-security probe rather than API artifacts.'
